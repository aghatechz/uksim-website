<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE23D"/>
      <stop offset="1" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- subtle circles decor -->
  <circle cx="60" cy="60" r="90" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="560" cy="540" r="120" fill="#FFFFFF" opacity="0.10"/>

  <!-- SIM card body -->
  <rect x="110" y="130" width="380" height="340" rx="30" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>
  <rect x="110" y="130" width="380" height="340" rx="30" fill="none" stroke="#FFE23D" stroke-opacity="0.35" stroke-width="2"/>

  <!-- SIM chip -->
  <rect x="150" y="190" width="96" height="72" rx="12" fill="#FFE23D"/>
  <rect x="168" y="196" width="12" height="60" rx="3" fill="#C89A00"/>
  <rect x="192" y="196" width="12" height="60" rx="3" fill="#C89A00"/>
  <rect x="150" y="210" width="96" height="8" rx="3" fill="#C89A00"/>
  <rect x="150" y="234" width="96" height="8" rx="3" fill="#C89A00"/>

  <!-- contact pins -->
  <circle cx="280" cy="205" r="7" fill="#FFE23D" opacity="0.85"/>
  <circle cx="305" cy="205" r="7" fill="#FFE23D" opacity="0.85"/>
  <circle cx="280" cy="228" r="7" fill="#FFE23D" opacity="0.85"/>
  <circle cx="305" cy="228" r="7" fill="#FFE23D" opacity="0.85"/>

  <!-- EE wordmark -->
  <text x="300" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="900" fill="#FFE23D" letter-spacing="-6">EE</text>

  <!-- UK SIM label -->
  <rect x="200" y="368" width="200" height="44" rx="22" fill="#FFE23D"/>
  <text x="300" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#141414" letter-spacing="2">UK SIM</text>

  <text x="300" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" opacity="0.75" letter-spacing="3">PAY-AS-YOU-GO</text>
</svg>
