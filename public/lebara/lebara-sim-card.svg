<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A3BA6"/>
      <stop offset="1" stop-color="#4A1D66"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1EBF6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- subtle circles decor -->
  <circle cx="540" cy="70" r="110" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="70" cy="540" r="130" fill="#FFFFFF" opacity="0.08"/>

  <!-- SIM card body -->
  <rect x="110" y="130" width="380" height="340" rx="30" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6"/>
  <rect x="110" y="130" width="380" height="340" rx="30" fill="none" stroke="#7A3BA6" stroke-opacity="0.25" stroke-width="2"/>

  <!-- SIM chip -->
  <rect x="150" y="190" width="96" height="72" rx="12" fill="#7A3BA6"/>
  <rect x="168" y="196" width="12" height="60" rx="3" fill="#5A2A80"/>
  <rect x="192" y="196" width="12" height="60" rx="3" fill="#5A2A80"/>
  <rect x="150" y="210" width="96" height="8" rx="3" fill="#5A2A80"/>
  <rect x="150" y="234" width="96" height="8" rx="3" fill="#5A2A80"/>

  <!-- contact pins -->
  <circle cx="280" cy="205" r="7" fill="#7A3BA6" opacity="0.85"/>
  <circle cx="305" cy="205" r="7" fill="#7A3BA6" opacity="0.85"/>
  <circle cx="280" cy="228" r="7" fill="#7A3BA6" opacity="0.85"/>
  <circle cx="305" cy="228" r="7" fill="#7A3BA6" opacity="0.85"/>

  <!-- Lebara wordmark -->
  <text x="300" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#7A3BA6" letter-spacing="1">Lebara</text>

  <!-- UK SIM label -->
  <rect x="205" y="360" width="190" height="44" rx="22" fill="#7A3BA6"/>
  <text x="300" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="2">UK SIM</text>

  <text x="300" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#7A3BA6" opacity="0.8" letter-spacing="3">PAY-AS-YOU-GO</text>
</svg>
